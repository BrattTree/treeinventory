<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mascot</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview.css">
<style>
.row { display:flex; gap:0; height:300px; }
.cell { flex:1; display:flex; align-items:center; justify-content:center; border-right:1px solid var(--border); position:relative; }
.cell:last-child { border-right:none; }
.cell.cream { background: var(--bt-cream); }
.cell.dark { background: var(--bt-bark); }
.cell.lime { background: var(--bt-lime); }
img { max-height:240px; max-width:90%; object-fit:contain; }
.caption { position:absolute; bottom:8px; left:0; right:0; text-align:center; font-family:var(--font-mono); font-size:10px; color:var(--fg-3); letter-spacing:.1em; text-transform:uppercase; }
.dark .caption { color: rgba(255,248,236,.65); }
</style></head>
<body><div class="card" style="padding:0">
  <div class="row">
    <div class="cell cream"><img src="../assets/mascot-color.png" alt=""><div class="caption">Standalone</div></div>
    <div class="cell dark"><img src="../assets/mascot-color.png" alt=""><div class="caption">On bark</div></div>
    <div class="cell lime"><img src="../assets/mascot-color.png" alt=""><div class="caption">On lime</div></div>
  </div>
</div></body></html>
