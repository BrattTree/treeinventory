<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mascot Circle / Social</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview.css">
<style>
.row { display:flex; gap:20px; padding:20px; align-items:center; background: var(--bt-cream); }
.avatar { width:130px; height:130px; border-radius:50%; overflow:hidden; border:3px solid var(--bt-ink); box-shadow: var(--sh-badge); background:#fff; }
.avatar img { width:100%; height:100%; object-fit:cover; display:block; }
.logotype { background: var(--bt-bark); padding:24px 30px; border-radius:18px; border:2px solid var(--bt-ink); }
.logotype img { display:block; max-height:140px; }
.note { font-size:12px; color:var(--fg-3); margin-top:8px; }
</style></head>
<body><div class="card" style="padding:0">
  <div class="row">
    <div class="avatar"><img src="../assets/mascot-circle-color.png" alt=""></div>
    <div class="logotype"><img src="../assets/logotype-color.png" alt="Wordmark"></div>
    <div style="flex:1">
      <div style="font-family:var(--font-headline); font-size:18px; text-transform:uppercase;">Social Lockups</div>
      <div class="note">Mascot circle for profile avatars (Instagram, Facebook, Google Business). Wordmark-only for header banners.</div>
    </div>
  </div>
</div></body></html>
