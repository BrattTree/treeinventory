<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview.css">
<style>
.row { display:flex; align-items:center; gap:24px; padding:6px 0; }
.icons { display:flex; gap:14px; }
.ic { width:44px; height:44px; border-radius:12px; border:2px solid var(--bt-ink); background:#fff; display:flex; align-items:center; justify-content:center; color: var(--bt-ink); }
.ic svg { width:22px; height:22px; }
.ic.dark { background: var(--bt-bark); color: var(--bt-cream); }
.ic.orange { background: var(--bt-orange); color:#fff; }
.note { font-size:12px; color:var(--fg-2); max-width:600px; }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="icons">
      <!-- Lucide-style icons inline. Stroke 2 / 24x24 -->
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 22h20L12 2z"/></svg></div>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/></svg></div>
      <div class="ic orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M10 21v-6h4v6"/></svg></div>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
      <div class="ic dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
    </div>
  </div>
  <div class="note" style="margin-top:10px"><b>Lucide</b> (CDN) is the substitute for functional UI icons. Stroke 2 at 24px, rounded caps. <b>Brand illustrations</b> (mascot, badges) come from <span class="mono">assets/</span> — see ICONOGRAPHY.</div>
</div></body></html>
