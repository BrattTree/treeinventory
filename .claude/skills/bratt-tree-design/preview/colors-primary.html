<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Brand Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview.css">
<style>
.swatches { display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; }
.sw { border:2px solid var(--bt-ink); border-radius:14px; overflow:hidden; box-shadow: var(--sh-1); }
.sw .chip { height:84px; }
.sw .meta { padding:8px 10px; background:#fff; border-top:2px solid var(--bt-ink); }
.sw .name { font-weight:800; font-size:13px; letter-spacing:.04em; text-transform:uppercase; }
.sw .hex { font-family: var(--font-mono); font-size:11px; color:var(--fg-2); }
</style></head>
<body><div class="card">
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:var(--bt-orange)"></div><div class="meta"><div class="name">Orange</div><div class="hex">#EB4C1B · PMS 166</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bt-lime)"></div><div class="meta"><div class="name">Lime Keyline</div><div class="hex">#E9E71D · PMS 396</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bt-bark)"></div><div class="meta"><div class="name">Bark</div><div class="hex">#26190E · PMS 7533</div></div></div>
  </div>
</div></body></html>
