<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview.css">
<style>
.row { display:flex; gap:18px; align-items:flex-end; }
.shape { background:var(--bt-bone); border:2px solid var(--bt-ink); width:84px; height:84px; }
.cap { font-family:var(--font-mono); font-size:11px; color:var(--fg-2); margin-top:6px; text-align:center; }
.name { font-weight:800; font-size:11px; letter-spacing:.06em; text-transform:uppercase; text-align:center; margin-top:2px; }
.cell { display:flex; flex-direction:column; align-items:center; }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="cell"><div class="shape" style="border-radius:4px"></div><div class="name">--r-1</div><div class="cap">4 px</div></div>
    <div class="cell"><div class="shape" style="border-radius:8px"></div><div class="name">--r-2</div><div class="cap">8 px</div></div>
    <div class="cell"><div class="shape" style="border-radius:14px"></div><div class="name">--r-3 · control</div><div class="cap">14 px</div></div>
    <div class="cell"><div class="shape" style="border-radius:22px"></div><div class="name">--r-4 · card</div><div class="cap">22 px</div></div>
    <div class="cell"><div class="shape" style="border-radius:32px"></div><div class="name">--r-badge</div><div class="cap">32 px</div></div>
    <div class="cell"><div class="shape" style="border-radius:999px; width:120px; height:40px"></div><div class="name">--r-pill</div><div class="cap">full</div></div>
  </div>
</div></body></html>
