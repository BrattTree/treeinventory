<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Wood Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview.css">
<style>
.swatches { display:grid; grid-template-columns: repeat(6, 1fr); gap:10px; }
.sw { border:2px solid var(--bt-ink); border-radius:12px; overflow:hidden; }
.sw .chip { height:64px; }
.sw .meta { padding:6px 8px; background:#fff; border-top:2px solid var(--bt-ink); }
.sw .name { font-weight:800; font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
.sw .hex { font-family: var(--font-mono); font-size:10px; color:var(--fg-2); }
</style></head>
<body><div class="card">
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:var(--bt-bark-deep)"></div><div class="meta"><div class="name">Bark Deep</div><div class="hex">#3D2B14</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bt-wood)"></div><div class="meta"><div class="name">Wood</div><div class="hex">#7A4120</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bt-wood-warm)"></div><div class="meta"><div class="name">Wood Warm</div><div class="hex">#A35817</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bt-wood-light)"></div><div class="meta"><div class="name">Wood Lite</div><div class="hex">#CC813B</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bt-rust)"></div><div class="meta"><div class="name">Rust</div><div class="hex">#6F3C30</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bt-clay)"></div><div class="meta"><div class="name">Clay</div><div class="hex">#8F6254</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bt-apricot)"></div><div class="meta"><div class="name">Apricot</div><div class="hex">#ED8E42</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bt-sand)"></div><div class="meta"><div class="name">Sand</div><div class="hex">#BE9A64</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bt-sand-light)"></div><div class="meta"><div class="name">Sand Lt</div><div class="hex">#DDC58A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bt-green)"></div><div class="meta"><div class="name">Green</div><div class="hex">#72BB32</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bt-green-dark)"></div><div class="meta"><div class="name">Forest</div><div class="hex">#448629</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bt-orange-warm)"></div><div class="meta"><div class="name">Org Warm</div><div class="hex">#EC511B</div></div></div>
  </div>
</div></body></html>
