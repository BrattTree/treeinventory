<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview.css">
<style>
.scale { display:flex; flex-direction:column; gap:4px; }
.row { display:flex; align-items:center; gap:14px; }
.bar { background:var(--bt-orange); height:14px; border-radius:3px; border:2px solid var(--bt-ink); }
.k { font-family:var(--font-mono); font-size:12px; width:90px; color:var(--fg-2); }
.px { font-family:var(--font-mono); font-size:11px; color:var(--fg-3); }
</style></head>
<body><div class="card">
  <div class="scale">
    <div class="row"><div class="k">--space-1</div><div class="bar" style="width:4px"></div><div class="px">4px</div></div>
    <div class="row"><div class="k">--space-2</div><div class="bar" style="width:8px"></div><div class="px">8px</div></div>
    <div class="row"><div class="k">--space-3</div><div class="bar" style="width:12px"></div><div class="px">12px</div></div>
    <div class="row"><div class="k">--space-4</div><div class="bar" style="width:16px"></div><div class="px">16px</div></div>
    <div class="row"><div class="k">--space-5</div><div class="bar" style="width:24px"></div><div class="px">24px</div></div>
    <div class="row"><div class="k">--space-6</div><div class="bar" style="width:32px"></div><div class="px">32px</div></div>
    <div class="row"><div class="k">--space-7</div><div class="bar" style="width:48px"></div><div class="px">48px</div></div>
    <div class="row"><div class="k">--space-8</div><div class="bar" style="width:64px"></div><div class="px">64px</div></div>
    <div class="row"><div class="k">--space-9</div><div class="bar" style="width:96px"></div><div class="px">96px</div></div>
    <div class="row"><div class="k">--space-10</div><div class="bar" style="width:128px"></div><div class="px">128px</div></div>
  </div>
</div></body></html>
