<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Logo Misuse</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview.css">
<style>
.grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; padding:14px; }
.tile { background:#fff; border:2px solid var(--bt-ink); border-radius:14px; aspect-ratio: 1.2; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
.tile img { max-width:80%; max-height:75%; }
.tile.ok { background: var(--bt-cream); }
.tag { position:absolute; bottom:6px; left:8px; right:8px; font-family:var(--font-body); font-weight:800; font-size:9px; letter-spacing:.08em; text-transform:uppercase; text-align:center; }
.ok .tag { color: var(--success); }
.bad .tag { color: var(--danger); }
.cross::before { content:""; position:absolute; inset:0; background: rgba(184,52,16,.08); }
.cross::after { content:"✕"; position:absolute; top:4px; right:6px; font-weight:900; color: var(--danger); font-size:16px; }
.skew img { transform: scaleX(1.6); }
.recolor img { filter: hue-rotate(170deg) saturate(.6); }
.busy { background: repeating-linear-gradient(45deg, #cce, #cce 8px, #fff 8px, #fff 16px); }
</style></head>
<body><div class="card" style="padding:0">
  <div class="grid">
    <div class="tile ok"><img src="../assets/logo-color.png"><div class="tag">✓ APPROVED</div></div>
    <div class="tile bad cross skew"><img src="../assets/logo-color.png"><div class="tag">DON'T STRETCH</div></div>
    <div class="tile bad cross recolor"><img src="../assets/logo-color.png"><div class="tag">DON'T RECOLOR</div></div>
    <div class="tile bad cross busy"><img src="../assets/logo-color.png"><div class="tag">DON'T USE BUSY BG</div></div>
  </div>
</div></body></html>
